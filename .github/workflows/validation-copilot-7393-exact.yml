name: Validation CopilotKit 7393 exact head

on:
  push:
    branches: [validation/copilot-7393-exact-ci]
    paths:
      - .github/workflows/validation-copilot-7393-exact.yml

permissions:
  contents: read

jobs:
  focused:
    if: github.repository == 'kvnloo/CopilotKit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact origin head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c92a19a88fd43e53b58b05a3b1786f0ba4ba850f
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: React renderer tests
        run: pnpm nx run @copilotkit/a2ui-renderer:test --skip-nx-cache

      - name: React renderer typecheck
        run: pnpm nx run @copilotkit/a2ui-renderer:check-types --skip-nx-cache

      - name: Vue tests
        run: pnpm nx run @copilotkit/vue:test --skip-nx-cache

      - name: Vue typecheck
        run: pnpm nx run @copilotkit/vue:check-types --skip-nx-cache

      - name: Angular tests
        run: pnpm nx run @copilotkit/angular:test --skip-nx-cache

      - name: Angular typecheck
        run: pnpm nx run @copilotkit/angular:check-types --skip-nx-cache
