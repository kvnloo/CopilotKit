name: Verify 7106 core-state roundtrip (fork only)

on:
  push:
    branches: [verify/7106-core-state-roundtrip]
    paths:
      - .github/workflows/verify-7106-roundtrip.yml
      - .oss-probes/7106/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    if: github.repository == 'kvnloo/CopilotKit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .oss-probes/7106
      - name: Checkout author's exact Python candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ltoniazzi/CopilotKit
          ref: d4397524453abcd6463cc50448e1ff8c33c3fdd5
          path: subject
          sparse-checkout: sdk-python
          persist-credentials: false
      - name: Checkout exact core response-state source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: CopilotKit/CopilotKit
          ref: eef659193309a8a4fc508289e87c2b80eff46a83
          path: client
          sparse-checkout: packages/core/src/interrupt-state.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout exact AG-UI helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ag-ui-protocol/ag-ui
          ref: e62b348680c41f52a5ea0ed4eb714a6600066fa1
          path: protocol
          sparse-checkout: sdks/typescript/packages/client/src/interrupts/index.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify sources and prepare the runtime import seam
        run: |
          set -euo pipefail
          test "$(git -C subject rev-parse HEAD)" = d4397524453abcd6463cc50448e1ff8c33c3fdd5
          test "$(git -C client rev-parse HEAD)" = eef659193309a8a4fc508289e87c2b80eff46a83
          test "$(git -C protocol rev-parse HEAD)" = e62b348680c41f52a5ea0ed4eb714a6600066fa1
          mkdir -p receipts
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          out = Path('.oss-probes/7106/generated')
          out.mkdir(parents=True, exist_ok=True)
          records = []
          for source, name, expected in [
              ('client/packages/core/src/interrupt-state.ts', 'interrupt-state.ts', '25a924b1e0182a9a3a50b6d9c448289c8991b16d'),
              ('protocol/sdks/typescript/packages/client/src/interrupts/index.ts', 'agui-interrupts.ts', '8261d29d6b09600307c9a00d2d30dfba6e2e3c19'),
          ]:
              data = Path(source).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected, (source, actual, expected)
              text = data.decode()
              if name == 'interrupt-state.ts':
                  text = text.replace('from "@ag-ui/client";', 'from "./agui-interrupts.ts";', 1)
              (out / name).write_text(text)
              records.append({'source': source, 'git_blob': actual})
          Path('receipts/source-hashes.json').write_text(json.dumps(records, indent=2))
          PY
      - name: Install Python candidate and record resolved dependencies
        run: |
          set -euo pipefail
          # Source and adapter are pinned. Other declared dependencies resolve
          # for this diagnostic environment; save exact versions for replay.
          # This is not the repository's frozen-lock support matrix.
          python -m pip install -e ./subject/sdk-python 'ag-ui-langgraph==0.0.43' pytest
          python -m pip freeze --exclude-editable > receipts/resolved-requirements.txt
          python -m pip check
          node --version > receipts/node-version.txt
          python --version > receipts/python-version.txt
      - name: Real graph roundtrip and named negative controls
        env:
          SUBJECT_DIR: ${{ github.workspace }}/subject
        run: |
          set -euo pipefail
          python .oss-probes/7106/paired_probe.py 2>&1 | tee receipts/paired-output.txt
          cp .oss-probes/7106/paired-receipt.json receipts/
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interrupt-roundtrip-evidence
          path: receipts/
          if-no-files-found: warn
          retention-days: 7
